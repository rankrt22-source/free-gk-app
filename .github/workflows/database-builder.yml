name: Build Static Exam Database

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  build-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Database Builder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_database.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "actions-user"
          git pull origin main --rebase || echo "Rebase skipped"
          git add pyq_bank.json cheat_sheets.json
          git commit -m "Automated update: Added new PYQs and Cheat Sheets" || exit 0
          git push origin main
