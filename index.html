<script>
function renderPYQs(data, lang = 'en') {
    const container = document.getElementById('pyq-container');
    if (!container) return;
    
    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">No PYQs available yet. Run the database builder action.</p>';
        return;
    }

    container.innerHTML = data.map(item => {
        const q = item.Question || item.question || {};
        const opts = item.Options || item.options || {};
        const exp = item.Explanation || item.explanation || {};
        const subject = item.Subject || item.subject || 'General';
        const exam = item.Exam || item.exam || 'UPSC/SSC';

        const questionText = typeof q === 'string' ? q : (q[lang] || q['en'] || '');
        const optionsText = typeof opts === 'string' ? opts : (opts[lang] || opts['en'] || '');
        const explanationText = typeof exp === 'string' ? exp : (exp[lang] || exp['en'] || '');

        return `
            <div class="bg-white rounded-lg shadow-md p-6 mb-4 border border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${subject}</span>
                    <span class="text-gray-500 text-xs">${exam}</span>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-3">${questionText}</h3>
                <div class="bg-gray-50 p-3 rounded mb-3 text-sm text-gray-700 whitespace-pre-line">${optionsText}</div>
                <div class="text-sm text-green-700 bg-green-50 p-3 rounded border border-green-200">
                    <strong>Explanation:</strong> ${explanationText}
                </div>
            </div>
        `;
    }).join('');
}

function renderCheatSheets(data, lang = 'en') {
    const container = document.getElementById('cheat-container');
    if (!container) return;

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">No Cheat Sheets available yet.</p>';
        return;
    }

    container.innerHTML = data.map(item => {
        const titleObj = item.Title || item.title || {};
        const contentObj = item.Content || item.content || {};
        const subject = item.Subject || item.subject || 'Revision';
        const time = item.Time || item.time || '1 Min';

        const titleText = typeof titleObj === 'string' ? titleObj : (titleObj[lang] || titleObj['en'] || '');
        const contentText = typeof contentObj === 'string' ? contentObj : (contentObj[lang] || contentObj['en'] || '');

        return `
            <div class="bg-white rounded-lg shadow-md p-6 mb-4 border border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-purple-100 text-purple-800 text-xs font-semibold px-2.5 py-0.5 rounded">${subject}</span>
                    <span class="text-gray-500 text-xs">⏱️ ${time}</span>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-3">${titleText}</h3>
                <div class="text-sm text-gray-700 whitespace-pre-line leading-relaxed">${contentText}</div>
            </div>
        `;
    }).join('');
}
</script>
