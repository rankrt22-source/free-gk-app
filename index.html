<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily GK & GS Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .active-tab { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .inactive-tab { color: #6b7280; font-weight: 500; }
        .cheat-sheet-card { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-10">
    
    <!-- App Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">Daily GK & GS</h1>
            <p class="text-xs text-blue-200">The Complete Exam Portal</p>
        </div>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-blue-800 text-white text-xs font-bold py-1.5 px-2 rounded-lg border border-blue-500 focus:outline-none">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="bn">বাংলা</option>
        </select>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-sm sticky top-[68px] z-10 border-b border-gray-200">
        <ul class="flex justify-around text-sm">
            <li class="flex-1 text-center py-3 cursor-pointer active-tab transition-all" id="tab-daily" onclick="switchTab('daily')">📰 Daily</li>
            <li class="flex-1 text-center py-3 cursor-pointer inactive-tab transition-all" id="tab-pyq" onclick="switchTab('pyq')">📜 PYQs</li>
            <li class="flex-1 text-center py-3 cursor-pointer inactive-tab transition-all" id="tab-notes" onclick="switchTab('notes')">⏱️ Cheat Sheets</li>
        </ul>
    </nav>

    <!-- Content Containers -->
    <main class="p-4 max-w-2xl mx-auto space-y-5">
        <div id="dailyContainer" class="block space-y-5"><div class="text-center text-gray-500 py-10 font-medium">Loading Daily News...</div></div>
        <div id="pyqContainer" class="hidden space-y-5"><div class="text-center text-gray-500 py-10 font-medium">Loading PYQ Bank...</div></div>
        <div id="notesContainer" class="hidden space-y-5"><div class="text-center text-gray-500 py-10 font-medium">Loading Cheat Sheets...</div></div>
    </main>

    <script>
        let currentLang = 'en';
        let dailyData = [];
        let pyqData = [];
        let notesData = [];

        // BULLETPROOF TEXT EXTRACTOR
        function getText(field) {
            if (!field) return '';
            let text = '';
            
            if (typeof field === 'string') {
                text = field;
            } else {
                text = field[currentLang] || field['en'] || '';
            }
            
            // SAFETY FIX: If the AI returns an array or object, force it to string so .split() never crashes
            if (Array.isArray(text)) return text.join(' ');
            if (typeof text === 'object') return JSON.stringify(text);
            return String(text);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            renderAll();
        }

        function switchTab(tabId) {
            ['daily', 'pyq', 'notes'].forEach(id => {
                document.getElementById(`tab-${id}`).className = `flex-1 text-center py-3 cursor-pointer transition-all ${tabId === id ? 'active-tab' : 'inactive-tab'}`;
                document.getElementById(`${id}Container`).classList.add('hidden');
            });
            document.getElementById(`${tabId}Container`).classList.remove('hidden');
        }

        async function fetchJSON(url, defaultData) {
            try {
                const res = await fetch(url + '?v=' + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    return Array.isArray(data) && data.length > 0 ? data : defaultData;
                }
            } catch (e) {
                console.warn("Fetch error for " + url, e);
            }
            return defaultData;
        }

        async function loadAllData() {
            dailyData = await fetchJSON('./latest_news.json', []);
            pyqData = await fetchJSON('./pyq_bank.json', []);
            notesData = await fetchJSON('./cheat_sheets.json', []);
            renderAll();
        }

        function renderAll() {
            // SAFETY FIX: Isolate each rendering function so one failure doesn't crash the others
            try { renderDaily(); } catch(e) { console.error("Error in renderDaily:", e); }
            try { renderPYQs(); } catch(e) { console.error("Error in renderPYQs:", e); }
            try { renderNotes(); } catch(e) { console.error("Error in renderNotes:", e); }
        }

        function parseOptions(optionsRaw) {
            if (!optionsRaw) return [];
            let optStr = String(optionsRaw);
            if (optStr.includes('|')) return optStr.split('|').map(o => o.trim());
            const matches = optStr.match(/[A-D]\)[^A-D]*/g);
            if (matches && matches.length > 0) return matches.map(o => o.trim());
            return [optStr];
        }

        function parseCorrectLetter(explanationText, optionsArray) {
            if (!explanationText) return 'A';
            const expUpper = String(explanationText).toUpperCase();
            for (let letter of ['A', 'B', 'C', 'D']) {
                if (expUpper.includes(letter + ')') || expUpper.includes('OPTION ' + letter) || expUpper.includes('CORRECT: ' + letter) || expUpper.includes('सही: ' + letter)) return letter;
            }
            if (expUpper.includes('BOTH') || expUpper.includes('दोनों') || expUpper.includes('উভয়')) {
                for (let opt of optionsArray) {
                    if (String(opt).toUpperCase().includes('BOTH') || String(opt).includes('दोनों')) return String(opt).charAt(0).toUpperCase();
                }
            }
            const match = expUpper.match(/\b([A-D])\b/);
            if (match) return match[1];
            return optionsArray.length > 0 ? String(optionsArray[0]).charAt(0).toUpperCase() : 'A';
        }

        function renderDaily() {
            const container = document.getElementById('dailyContainer');
            if(!dailyData || dailyData.length === 0) { container.innerHTML = '<div class="text-center py-10 font-bold text-gray-500">No news today!</div>'; return; }
            container.innerHTML = '';
            
            dailyData.forEach((item, idx) => {
                try { // SAFETY FIX: Protect each individual item
                    const opts = parseOptions(getText(item.Options));
                    const expl = getText(item.Explanation);
                    const correct = parseCorrectLetter(expl, opts);

                    const optHtml = opts.map((opt, oIdx) => {
                        const optLetter = opt ? String(opt).charAt(0).toUpperCase() : 'A';
                        return `<button id="d-opt-${idx}-${oIdx}" onclick="check('daily', ${idx}, ${oIdx}, '${optLetter}', '${correct}')" class="daily-btn-${idx} w-full text-left p-3 border border-gray-200 rounded-lg bg-white hover:bg-blue-50 text-sm mb-2 font-medium flex justify-between focus:outline-none"><span>${opt}</span><span id="d-badge-${idx}-${oIdx}" class="hidden text-xs font-bold px-2 py-0.5 rounded"></span></button>`;
                    }).join('');
                    
                    const summaryItems = getText(item.Summary).split('•').filter(s=>s.trim()).map(s=>`<li class="ml-4 list-disc text-sm text-gray-700">${s.trim()}</li>`).join('');

                    container.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded uppercase">${item.Subject || 'GK'}</span>
                            <h2 class="text-lg font-bold text-gray-900 mt-2 mb-2">${getText(item.Headline)}</h2>
                            <ul class="mb-4">${summaryItems}</ul>
                            <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100">
                                <p class="font-medium text-sm text-gray-800 mb-3">${getText(item.Question)}</p>
                                ${optHtml}
                                <div id="d-ans-${idx}" class="hidden mt-3 p-3 bg-green-50 border border-green-200 text-green-900 rounded-lg text-sm">${expl}</div>
                            </div>
                        </div>`;
                } catch(e) { console.error('Failed to render news item:', e); }
            });
        }

        function renderPYQs() {
            const container = document.getElementById('pyqContainer');
            if(!pyqData || pyqData.length === 0) { container.innerHTML = '<div class="text-center py-10 font-bold text-gray-500">No PYQs available.</div>'; return; }
            container.innerHTML = '';
            
            pyqData.forEach((item, idx) => {
                try { // SAFETY FIX: Protect each individual PYQ
                    const opts = parseOptions(getText(item.Options));
                    const expl = getText(item.Explanation);
                    const correct = parseCorrectLetter(expl, opts);

                    const optHtml = opts.map((opt, oIdx) => {
                        const optLetter = opt ? String(opt).charAt(0).toUpperCase() : 'A';
                        return `<button id="p-opt-${idx}-${oIdx}" onclick="check('pyq', ${idx}, ${oIdx}, '${optLetter}', '${correct}')" class="pyq-btn-${idx} w-full text-left p-3 border border-gray-200 rounded-lg bg-white hover:bg-yellow-50 text-sm mb-2 font-medium flex justify-between focus:outline-none"><span>${opt}</span><span id="p-badge-${idx}-${oIdx}" class="hidden text-xs font-bold px-2 py-0.5 rounded"></span></button>`;
                    }).join('');

                    container.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm border border-yellow-300 border-t-4 p-5 mb-4">
                            <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded uppercase">${item.Exam || 'PYQ'}</span>
                            <p class="font-bold text-base text-gray-800 mt-3 mb-4">${getText(item.Question)}</p>
                            ${optHtml}
                            <div id="p-ans-${idx}" class="hidden mt-3 p-3 bg-green-50 border border-green-200 text-green-900 rounded-lg text-sm">${expl}</div>
                        </div>`;
                } catch(e) { console.error('Failed to render PYQ item:', e); }
            });
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            if(!notesData || notesData.length === 0) { container.innerHTML = '<div class="text-center py-10 font-bold text-gray-500">No Cheat Sheets available.</div>'; return; }
            container.innerHTML = '';
            
            notesData.forEach((item) => {
                try { // SAFETY FIX: Protect each individual Cheat Sheet
                    const contentItems = getText(item.Content).split('•').filter(s=>s.trim()).map(s=>`<li class="flex items-start text-sm text-gray-800 font-medium"><span class="mr-2 text-blue-500">⚡</span>${s.trim()}</li>`).join('');

                    container.innerHTML += `
                        <div class="cheat-sheet-card rounded-xl shadow-sm border border-blue-200 p-5 relative overflow-hidden mb-4">
                            <div class="absolute top-0 right-0 bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">${item.Time || '1 Min Read'}</div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded uppercase">${item.Subject || 'GK'}</span>
                            <h2 class="text-xl font-extrabold text-gray-900 mt-2 mb-3 leading-tight">${getText(item.Title)}</h2>
                            <ul class="mt-2 space-y-2">${contentItems}</ul>
                        </div>`;
                } catch(e) { console.error('Failed to render Note item:', e); }
            });
        }

        function check(type, idx, oIdx, sel, cor) {
            const prefix = type === 'daily' ? 'd' : 'p';
            document.querySelectorAll(`.${type}-btn-${idx}`).forEach(btn => btn.disabled = true);
            const sBtn = document.getElementById(`${prefix}-opt-${idx}-${oIdx}`);
            const sBad = document.getElementById(`${prefix}-badge-${idx}-${oIdx}`);
            if(sBad) sBad.classList.remove('hidden');

            if (sel === cor) {
                sBtn.className = "w-full text-left p-3 border-2 border-green-500 rounded-lg bg-green-100 text-sm mb-2 text-green-900 font-bold flex justify-between";
                sBad.className = "text-xs font-bold px-2 py-0.5 rounded bg-green-600 text-white"; sBad.innerText = "✓ Correct";
            } else {
                sBtn.className = "w-full text-left p-3 border-2 border-red-500 rounded-lg bg-red-100 text-sm mb-2 text-red-900 font-medium flex justify-between";
                sBad.className = "text-xs font-bold px-2 py-0.5 rounded bg-red-600 text-white"; sBad.innerText = "✕ Wrong";
                document.querySelectorAll(`.${type}-btn-${idx}`).forEach((btn, i) => {
                    const btnText = btn.querySelector('span').innerText.trim().toUpperCase();
                    if (btnText.startsWith(cor + ')') || btnText.startsWith(cor + '.')) {
                        btn.className = "w-full text-left p-3 border-2 border-green-500 rounded-lg bg-green-100 text-sm mb-2 text-green-900 font-bold flex justify-between";
                        const b = document.getElementById(`${prefix}-badge-${idx}-${i}`);
                        if(b) {
                            b.classList.remove('hidden'); 
                            b.className = "text-xs font-bold px-2 py-0.5 rounded bg-green-600 text-white"; 
                            b.innerText = "✓ Correct Answer";
                        }
                    }
                });
            }
            document.getElementById(`${prefix}-ans-${idx}`).classList.remove('hidden');
        }

        loadAllData();
    </script>
</body>
</html>
